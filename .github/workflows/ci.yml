name: CI

on:
  push:
    branches: [main, standalone, experiment/desktop-furigana]
  pull_request:
  workflow_dispatch:

# 检查 + 打包，生成可下载 artifact；发布正式 Release 单独处理。
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release 说明要按 tag 取提交历史，浅克隆不够

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查
        run: |
          for f in src/*.js tools/*.js tools/*.cjs tests/*.cjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: manifest.json 合法性
        run: node -e "const m=require('./src/manifest.json'); if(m.manifest_version!==1) throw new Error('manifest_version 不是 1'); console.log('v'+m.version, m.slug)"

      # BetterNCM 商店按 subpath=/src 直接分发 src/，这些是上架准则要求的
      - name: 上架准则检查
        run: |
          node -e "
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('src/manifest.json','utf8'));
          for (const k of ['name','slug','version','author','description','preview','betterncm_version']) {
            if (!m[k]) throw new Error('manifest 缺 '+k);
          }
          if (!fs.existsSync('src/'+m.preview)) throw new Error('预览图不存在: '+m.preview);
          const kb = fs.statSync('src/'+m.preview).size/1024;
          if (kb > 200) throw new Error('预览图 '+kb.toFixed(0)+' KB, 准则要求压缩');
          const s = fs.readFileSync('src/main.js','utf8');
          if (!s.includes('betterncm.ncm.openUrl')) throw new Error('设置页缺少用 openUrl 打开的仓库/反馈链接');
          console.log('预览图 '+kb.toFixed(0)+' KB, 元信息与外链检查通过');
          "

      - name: 安装测试依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 独立版分发检查
        run: npm run check:store

      - name: 注音逻辑、外部来源、缓存与漏注音回归
        run: npm test

      # fixture 含整首歌词没有入库，这一步在 CI 上会自动 SKIP
      - name: 接口链路 (缺 fixture 则跳过)
        run: node tools/test-api-romaji.js

      # RefinedNowPlaying 的逐字歌词 DOM，用 jsdom 模拟着跑一遍
      - name: 第三方歌词插件兼容 (RNP / LyricBar 逐字)
        run: |
          node tools/test-rnp-dom.js
          node tools/test-rnp-dom.js slide
          node tools/test-rnp-dom.js float noruby
          node tools/test-rnp-dom.js slide noruby
          node tools/test-rnp-dom.js lyricbar
          node tools/test-rnp-dom.js lyricbar noruby

      - name: 打包冒烟
        run: node tools/pack.js

      - name: 校验产物
        run: |
          test -f builds/jp-furigana-plus.plugin
          unzip -t builds/jp-furigana-plus.plugin
          # manifest.json 必须在 zip 根层，否则 BetterNCM 认不出来
          unzip -l builds/jp-furigana-plus.plugin | grep -qE ' manifest\.json$'
          # 条目名不能有反斜杠（用字符类而不是 '\\'，后者会让 grep 报 Trailing backslash）
          if unzip -l builds/jp-furigana-plus.plugin | grep -q '[\]'; then
            echo "条目名里有反斜杠"; exit 1
          fi
          echo "产物校验通过"

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: jp-furigana-plus-plugin
          path: builds/jp-furigana-plus.plugin
          if-no-files-found: error

  windows-save:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/cache-write.test.cjs
      - name: Build and verify transparent desktop renderer
        shell: powershell
        run: ./tools/build-desktop-host.ps1 -Check
      - name: Desktop IPC and lifecycle
        run: node tests/desktop-native.test.cjs
